name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - run: pip install -r worker/requirements.txt
      - name: Unit tests (no paid API calls; the LLM client is mocked)
        run: make test
      - name: Benchmark baseline
        run: make eval

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -f api/pom.xml verify
