# Development override: adds a local AWS emulator for S3 and SQS and points the
# services at it. No real AWS account or cost is involved.
#
# LocalStack stopped shipping a free, token-free image in March 2026. This file pins
# the last community version. If that image no longer pulls, swap `image:` for another
# emulator on port 4566 (for example `hectorvent/floci:latest`) or use a free
# LocalStack token (set LOCALSTACK_AUTH_TOKEN and use `localstack/localstack:latest`).
# Nothing else changes: the services only read AWS_ENDPOINT_URL.

services:
  aws:
    image: localstack/localstack:4.12
    environment:
      SERVICES: s3,sqs
    ports:
      - "4566:4566"
    volumes:
      - ./infra/aws-emulator/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro

  api:
    depends_on:
      - aws
    environment:
      AWS_ENDPOINT_URL: http://aws:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test

  worker:
    depends_on:
      - aws
    environment:
      AWS_ENDPOINT_URL: http://aws:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
